<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Toolkit</title>
  <link rel="stylesheet" href="style2.css">
  <script src="script3.js" defer></script>
</head>
<body>

  <header>
    <h1>Notes Toolkit</h1>
    <button id="theme-toggle" type="button">Toggle Theme</button>
  </header>

  <main>
    <section>
      <label for="note-text">Enter Note Content:</label>
      <textarea id="note-text" placeholder="Type your note here..."></textarea>

      <div class="meta-container">
        <p id="char-count">Characters: 0</p>
        <p id="word-count">Words: 0</p>
      </div>

      <button id="clear-btn" type="button">Clear Text</button>
    </section>
  </main>

  <footer>
    <p>Notes Toolkit</p>
  </footer>

</body>
</html>
